## thorny config for cloud sensors (deployed by deploy/startup.sh to /etc/thorny/config.yaml)
## ##PUBLICIP## is replaced by startup.sh with the public IPv4 of the instance.
network:
  primaryIp: '##PUBLICIP##'
logging:
  logDir: '/var/spool/thorny'
  rotateMinutes: 10
tls:
  organization: 'Some Org'
  country: 'Germany'
  province: ' NRW'
  locality: 'NRW'
  streetAddress: 'Somestreet'
  postalCode: '48143'
  commonName: 'Some Name'
  dnsNames:
    - 'nsec.uni-muenster.de'
  daysValid: 31
  certPath: '/root/config/thorny/tls/cert.pem'
  keyPath: '/root/config/thorny/tls/key.pem'

## A Map of Handlers. Uses the port a the handler should use as key.
handlers:
  25:
    name: smtp_handler
    config:
  22:
    name: ssh_handler
    config:
      values:
        version: 'OpenSSH_8.9p1'
        message_limit: 10
        id_ed25519: '/root/config/thorny/ssh/id_ed25519'
        id_rsa: '/root/config/thorny/ssh/id_rsa'
        id_ecdsa: '/root/config/thorny/ssh/id_ecdsa'
  389:
    name: ldap_handler
    config:
      values:
        fakeSearchresultEntry: 'uid=admin,dc=example,dc=com' # TODO
  23:
    name: telnet_handler
    config:
      values:
        message_limit: 10

filters:
  - name: ipfilter
    config:
      ips:
