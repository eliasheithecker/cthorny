[project]
name = "analyser"
version = "0.1.0"
description = "Nächtliche Auswertung der Thorny-Sensordaten"
requires-python = ">=3.11,<3.13" # 3.12.16 für Notebook
dependencies = [
    "pyspark>=4.0",
    "pandas<3",
]
# "pandas<3" pyspark pyarrow ipykernel fürs Notebook funktioniert


[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "models",
    "utils",
    "workflows",
    "workflows.aggregate",
    "workflows.aggregate.s1_pre_process",
    "workflows.aggregate.s2_analyse",
    "workflows.aggregate.s3_upload",
    "workflows.aggregate.s4_post_process",
    "workflows.daily",
    "workflows.daily.s1_collect",
    "workflows.daily.s2_pre_process",
    "workflows.daily.s3_identify",
    "workflows.daily.s4_analyse",
    "workflows.daily.s5_convert",
    "workflows.daily.s6_upload",
    "workflows.daily.s7_post_process",
]
py-modules = ["main"]

[tool.setuptools.package-data]
"utils" = ["multiple.ini"]
"workflows.daily.s3_identify" = ["scanners.csv"]
